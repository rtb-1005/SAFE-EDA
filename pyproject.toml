[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-eda"
version = "1.0.0"
description = "Artifact-supervised electrodermal activity models and experimental result reproduction"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "matplotlib==3.11.1",
    "torch==2.11.0",
]

[project.scripts]
safe-eda = "safe_eda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
